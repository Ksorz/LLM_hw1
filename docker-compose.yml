services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: llm_service
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [llm_network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d llm_service || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:14443:8000"
    volumes:
      - ./:/app
      - model_cache:/root/.cache/huggingface
    environment:
      PYTHONUNBUFFERED: "1"
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
      WANDB_API_KEY: ${WANDB_API_KEY:-}
      WANDB_PROJECT: ${WANDB_PROJECT:-llm_service}
      DATABASE_URL: postgresql://postgres:postgres@db:5432/llm_service
    # По умолчанию запускаем API. Для ручного dev-режима можно задать
    # переменную API_CMD, например: API_CMD="tail -f /dev/null" или
    # API_CMD="python serve.py --host 0.0.0.0 --port 8000 --onnx /app/output_dir/onnx/exp1/model.onnx"
    command: ${API_CMD:-python serve.py --host 0.0.0.0 --port 8000}
    depends_on:
      db:
        condition: service_healthy
    gpus: "all"
    networks: [llm_network]
    restart: unless-stopped
    healthcheck:
      # Если API_CMD задан (ручной режим), healthcheck пропускается.
      test: ["CMD-SHELL", "[ -n \"$API_CMD\" ] && exit 0 || curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:14442:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_started
    networks: [llm_network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8501/_stcore/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "127.0.0.1:14440:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks: [llm_network]
    restart: unless-stopped
    profiles: [monitoring]

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:14441:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    networks: [llm_network]
    restart: unless-stopped
    profiles: [monitoring]

volumes:
  model_cache:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  llm_network:
    driver: bridge
